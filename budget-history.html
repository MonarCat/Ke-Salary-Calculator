    <style>
        .page-hero {
            background: linear-gradient(135deg, #1a6b3c 0%, #006600 100%);
            color: #fff; border-radius: 12px; padding: 32px 28px 24px;

        .budget-cards-grid {
            display: grid;

        .budget-history-card {

            transition: box-shadow 0.2s;

        .budget-history-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
        .bh-month { font-size: 1em; font-weight: bold; color: #333; margin-bottom: 6px; }
        body.dark-mode .bh-month { color: #ccc; }
        .bh-gross { font-size: 0.85em; color: #666; margin-bottom: 8px; }
        body.dark-mode .bh-gross { color: #aaa; }
        .bh-score {
            display: inline-block; padding: 4px 14px; border-radius: 20px;
            font-weight: bold; font-size: 0.9em; margin-bottom: 10px;
        }
        .score-a { background: #e8f5e9; color: #2e7d32; }
        .score-b { background: #fff8e1; color: #f57f17; }
        .score-c { background: #fff3e0; color: #e65100; }
        .score-d { background: #ffebee; color: #c62828; }

<body>
    <div class="overlay">
        <div class="container">
            <div id="site-header"></div>

            <div class="page-hero">
                <h1><i class="fas fa-history"></i> Budget History</h1>
                <p>Track your monthly financial health scores and savings trends over time</p>
            </div>

            <div id="main-content">
                <!-- Premium gate or content rendered here -->
            </div>
        </div>
    </div>

    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="/assets/js/nav-partial.js?v=2.0"></script>
    <script src="assets/js/nav-toggle.js"></script>
    <script src="assets/js/format-utils.js"></script>
    <script>
        // Dark mode
        const dmToggle = document.getElementById('darkModeToggle');
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            if (dmToggle) dmToggle.textContent = '☀️ Light';
        }
        if (dmToggle) dmToggle.addEventListener('click', function () {
            document.body.classList.toggle('dark-mode');
            const on = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', on);
            dmToggle.textContent = on ? '☀️ Light' : '🌙 Dark';
        });

        let trendChart = null;

        function showAuthPrompt() {
            document.getElementById('main-content').innerHTML = `
                <div style="text-align:center;padding:60px 20px;">
                    <i class="fas fa-lock" style="font-size:3em;color:#006600;margin-bottom:16px;"></i>
                    <h2>Sign In Required</h2>
                    <p>Please sign in to access your budget history.</p>
                    <a href="/auth.html" style="display:inline-block;padding:12px 30px;background:#006600;color:#fff;border-radius:8px;text-decoration:none;font-weight:bold;">Sign In / Register</a>
                </div>`;
        }
        function showUpgradePrompt() {
            document.getElementById('main-content').innerHTML = `
                <div style="text-align:center;padding:60px 20px;background:linear-gradient(135deg,#FFD700,#FFA500);border-radius:15px;color:#fff;margin:20px 0;">
                    <i class="fas fa-crown" style="font-size:3em;margin-bottom:16px;"></i>
                    <h2>Budget History — Premium Feature</h2>
                    <p>Upgrade to Premium to track your budget history and health trends.</p>
                    <p><strong>KES 99/month</strong> or <strong>KES 999/year</strong></p>
                    <a href="/account.html#upgrade" style="display:inline-block;padding:14px 36px;background:#006600;color:#fff;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:10px;">Upgrade to Premium →</a>
                </div>`;
        }

        function scoreGrade(score) {
            if (!score && score !== 0) return { grade: '—', cls: 'score-none' };
            if (score >= 80) return { grade: 'A — Excellent', cls: 'score-a' };
            if (score >= 60) return { grade: 'B — Good',      cls: 'score-b' };
            if (score >= 40) return { grade: 'C — Fair',      cls: 'score-c' };
            return { grade: 'D — Needs Work', cls: 'score-d' };
        }

        async function copyToThisMonth(budgetId) {
            const now = new Date();
            const month = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
            const monthDate = /^\d{4}-\d{2}$/.test(month) ? `${month}-01` : month;
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            if (!user) return;

            // Fetch original budget and its items
            const { data: orig } = await window.supabaseClient.from('user_budgets').select('*').eq('id', budgetId).single();
            const { data: items } = await window.supabaseClient.from('budget_line_items').select('*').eq('budget_id', budgetId);
            if (!orig) return;

            const { data: newBudget } = await window.supabaseClient.from('user_budgets').upsert({
                user_id: user.id, budget_month: monthDate,
                gross_salary: orig.gross_salary, net_salary: orig.net_salary,
                total_budgeted: orig.total_budgeted, updated_at: new Date().toISOString()
            }, { onConflict: 'user_id,budget_month' }).select().single();

            if (newBudget && items?.length) {
                await window.supabaseClient.from('budget_line_items').delete().eq('budget_id', newBudget.id);
                await window.supabaseClient.from('budget_line_items').insert(
                    items.map((i, idx) => ({
                        budget_id: newBudget.id,
                        category_id: i.category_id || null,
                        category_name: i.category_name,
                        category_group: i.category_group,
                        icon: i.icon || 'ti-circle',
                        allocated_amount: i.allocated_amount || 0,
                        sort_order: i.sort_order || (idx + 1),
                        notes: i.notes || null
                    }))
                );
            }
            alert('Budget copied to ' + month + '! Opening Budget Planner…');
            window.location.href = '/budget-planner.html';
        }

        function escapeHtml(value) {
            const node = document.createElement('div');
            node.textContent = value == null ? '' : String(value);
            return node.innerHTML;
        }

        async function init() {
            if (!window.supabaseClient) { showAuthPrompt(); return; }
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            if (!user) { showAuthPrompt(); return; }

            const { data: profile } = await window.supabaseClient
                .from('user_profiles').select('premium,premium_expires_at').eq('id', user.id).single();
            const isPremium = profile?.premium && (!profile.premium_expires_at || new Date(profile.premium_expires_at) > new Date());
            if (!isPremium) { showUpgradePrompt(); return; }

            // Fetch budgets + health scores (left join via select)
            const { data: budgets, error } = await window.supabaseClient
                .from('user_budgets')
                .select('id,budget_month,gross_salary,net_salary,total_budgeted,financial_health_scores(overall_score,grade)')
                .eq('user_id', user.id)
                .order('budget_month', { ascending: false })
                .limit(24);

            if (error) {
                const message = document.createElement('p');
                message.style.color = '#c62828';
                message.textContent = 'Error loading history: ' + (error.message || 'Unknown error');
                document.getElementById('main-content').replaceChildren(message);
                return;
            }

            if (!budgets || budgets.length === 0) {
                document.getElementById('main-content').innerHTML = `
                    <div class="card">
                        <div class="empty-state">
                            <i class="fas fa-chart-line" style="color:#ccc;"></i>
                            <p>No saved budgets yet.</p>
                            <a href="/budget-planner.html" style="display:inline-block;padding:11px 28px;background:#006600;color:#fff;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:12px;">Create Your First Budget →</a>
                        </div>
                    </div>`;
                return;
            }

            // Build chart data (last 12 months ascending)
            const chartBudgets = [...budgets].reverse().slice(-12);
            const chartLabels = chartBudgets.map(b => FormatUtils.shortMonthLabel(b.budget_month));
            const chartScores = chartBudgets.map(b => b.financial_health_scores?.[0]?.overall_score ?? null);

            const contentHTML = `
                <div class="card">
                    <h3><i class="fas fa-chart-line"></i> Health Score Trend (Last 12 Months)</h3>
                    <div class="chart-container">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h3><i class="fas fa-calendar-alt"></i> Monthly Budgets</h3>
                    <div style="text-align:right;margin-bottom:12px;">
                        <a href="/budget-planner.html" class="btn-sm btn-green"><i class="fas fa-plus"></i> New Budget</a>
                    </div>
                    <div class="budget-cards-grid" id="budgetCardsGrid"></div>
                </div>`;
            document.getElementById('main-content').innerHTML = contentHTML;

            // Render trend chart
            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Health Score',
                        data: chartScores,
                        borderColor: '#006600',
                        backgroundColor: 'rgba(0,102,0,0.12)',
                        pointBackgroundColor: '#006600',
                        tension: 0.35,
                        fill: true,
                        spanGaps: true,
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { min: 0, max: 100, grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { callback: v => v + '/100' } },
                        x: { grid: { display: false } }
                    },
                    responsive: true, maintainAspectRatio: false,
                }
            });

            // Render budget cards
            const grid = document.getElementById('budgetCardsGrid');
            grid.innerHTML = budgets.map(b => {
                const hs = b.financial_health_scores?.[0];
                const { grade, cls } = scoreGrade(hs?.overall_score);
                const savings = Math.max(b.net_salary - b.total_budgeted, 0);
                const monthFmt = FormatUtils.monthLabel(b.budget_month);
                return `<div class="budget-history-card">
                    <div class="bh-month"><i class="fas fa-calendar" style="color:#1a6b3c;margin-right:5px;"></i>${monthFmt}</div>
                    <div class="bh-gross">Gross: ${FormatUtils.formatKES(b.gross_salary)} &nbsp;|&nbsp; Net: ${FormatUtils.formatKES(b.net_salary)}</div>
                    ${hs ? `<span class="bh-score ${cls}">${hs.overall_score}/100 — ${grade}</span>` : `<span class="bh-score score-none">No health score</span>`}
                    <div class="bh-savings"><i class="fas fa-piggy-bank"></i> Unallocated: ${FormatUtils.formatKES(savings)}</div>
                    <div class="bh-actions">
                        <a href="/budget-planner.html?budget=${encodeURIComponent(String(b.id))}" class="btn-sm btn-green"><i class="fas fa-eye"></i> View</a>
                        <button class="btn-sm btn-outline bh-copy-budget" data-budget-id="${escapeHtml(b.id)}"><i class="fas fa-copy"></i> Copy to This Month</button>
                    </div>
                </div>`;
            }).join('');
            grid.querySelectorAll('.bh-copy-budget').forEach((button) => {
                button.addEventListener('click', () => copyToThisMonth(button.dataset.budgetId));
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
