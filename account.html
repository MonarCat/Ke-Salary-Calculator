    <script>
        // Populate user info bar once auth resolves
        (async function () {
            if (typeof checkAuthStatus !== 'function') return;
            const user = await checkAuthStatus();
            if (!user) {
                window.location.href = '/auth.html?redirect=/account';
                return;
            }
            const bar    = document.getElementById('sc-user-bar');
            const avatar = document.getElementById('sc-user-avatar');
            const name   = document.getElementById('sc-user-name');
            const email  = document.getElementById('sc-user-email');
            if (!bar) return;
            bar.style.display = 'flex';
            const displayName = user.user_metadata?.full_name || user.email || 'User';
            if (avatar) avatar.textContent = displayName.charAt(0).toUpperCase();
            if (name)   name.textContent   = displayName;
            if (email)  email.textContent  = user.email || '';
            // Expose email for Paystack
            window.__SC_USER_EMAIL = user.email || '';
        }());
    </script>
