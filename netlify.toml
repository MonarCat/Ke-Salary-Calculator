# netlify.toml – Netlify build and functions configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Publish directory (static HTML/CSS/JS site – no build step required)
  publish = "."
  # Serverless functions directory
  functions = "netlify/functions"

# ── Security headers ───────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── Functions: increase timeout for PayPal IPN verification ───────────────
[functions]
  node_bundler = "esbuild"

[functions."paypal-webhook"]
  included_files = []
