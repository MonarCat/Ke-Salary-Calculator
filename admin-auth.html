<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - Kenya Salary Calculator</title>
    <!-- Prevent search engines from indexing this page -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Hide admin auth container until auth check completes to avoid flash */
        .admin-auth-wrapper { visibility: hidden; }
        .admin-auth-wrapper.auth-ready { visibility: visible; }

        .admin-auth-container {
            max-width: 460px;
            margin: 40px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .admin-auth-header {
            background: linear-gradient(135deg, #006600, #009900);
            color: white;
            padding: 28px 30px 20px;
            text-align: center;
        }

        .admin-auth-header h1 {
            color: white;
            font-size: 1.5em;
            margin: 10px 0 6px;
        }

        .admin-auth-header p {
            font-size: 0.9em;
            opacity: 0.85;
            margin: 0;
        }

        .admin-auth-header .shield-icon {
            font-size: 2.5em;
        }

        .admin-auth-form {
            padding: 30px;
        }

        .admin-auth-form .form-group {
            margin-bottom: 20px;
        }

        .admin-auth-form label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .admin-auth-form label i {
            margin-right: 5px;
            color: #006600;
        }

        .admin-auth-form input[type="email"],
        .admin-auth-form input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .admin-auth-form input:focus {
            outline: none;
            border-color: #006600;
            box-shadow: 0 0 0 3px rgba(0,102,0,0.12);
        }

        .admin-auth-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #006600, #009900);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 6px;
        }

        .admin-auth-button:hover:not(:disabled) {
            background: linear-gradient(135deg, #004d00, #007700);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,102,0,0.3);
        }

        .admin-auth-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .admin-auth-message {
            padding: 12px 15px;
            border-radius: 6px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }

        .admin-auth-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .admin-auth-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .admin-auth-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .rate-limit-notice {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 16px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .back-link a {
            color: #006600;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="disclaimer-banner">
        <p>🇰🇪 Admin Access - Kenya Salary Calculator</p>
    </div>

    <div class="overlay">
        <div class="container">
            <!-- Logo -->
            <div class="logo-container">
                <a href="/">
                    <img src="Logo.png" alt="Kenya Salary Calculator Logo">
                </a>
            </div>

            <div class="admin-auth-wrapper" id="adminAuthWrapper">
                <div class="admin-auth-container">
                    <div class="admin-auth-header">
                        <div class="shield-icon" aria-hidden="true"><i class="fas fa-shield-alt"></i></div>
                        <h1>Admin Sign In</h1>
                        <p>Restricted access &mdash; authorized personnel only</p>
                    </div>

                    <div class="admin-auth-form">
                        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" novalidate>
                            <div class="form-group">
                                <label for="admin-email">
                                    <i class="fas fa-envelope" aria-hidden="true"></i> Email Address
                                </label>
                                <input
                                    type="email"
                                    id="admin-email"
                                    name="email"
                                    required
                                    autocomplete="username"
                                    placeholder="Enter your admin email"
                                    aria-required="true"
                                    aria-describedby="adminLoginMessage"
                                >
                            </div>

                            <div class="form-group">
                                <label for="admin-password">
                                    <i class="fas fa-lock" aria-hidden="true"></i> Password
                                </label>
                                <input
                                    type="password"
                                    id="admin-password"
                                    name="password"
                                    required
                                    autocomplete="current-password"
                                    placeholder="Enter your password"
                                    aria-required="true"
                                    aria-describedby="adminLoginMessage"
                                >
                            </div>

                            <button type="submit" class="admin-auth-button" id="adminLoginBtn">
                                <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Sign In to Admin
                            </button>
                        </form>

                        <div id="adminLoginMessage" class="admin-auth-message" role="alert" aria-live="polite"></div>

                        <p class="rate-limit-notice">
                            <i class="fas fa-info-circle" aria-hidden="true"></i>
                            Repeated failed attempts will temporarily lock this page.
                        </p>

                        <div class="back-link">
                            <a href="/" aria-label="Return to home page"><i class="fas fa-home" aria-hidden="true"></i> Return to Home</a>
                        </div>
                    </div>
                </div>
            </div>

            <footer style="text-align: center; padding: 20px; margin-top: 30px; font-size: 12px; color: #666;">
                <p style="margin-bottom: 10px;">
                    <a href="/privacy-policy.html" style="color: #006600; text-decoration: none; margin: 0 10px;">Privacy Policy</a> |
                    <a href="/terms-of-service.html" style="color: #006600; text-decoration: none; margin: 0 10px;">Terms of Service</a>
                </p>
                <p>Designed by <a href="https://salarycalculator.co.ke/" target="_blank" rel="noopener noreferrer" style="color: #006600;">a Patriotic Kenyan</a></p>
            </footer>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        // ── Rate-limiting constants ──────────────────────────────────────────────
        const RATE_LIMIT_MAX_ATTEMPTS  = 5;
        const RATE_LIMIT_WINDOW_MS     = 15 * 60 * 1000; // 15 minutes
        const RATE_LIMIT_KEY           = 'admin_auth_attempts';
        const REDIRECT_DELAY_MS        = 1200; // delay (ms) before redirecting to dashboard

        // ── HTTPS enforcement ─────────────────────────────────────────────────────
        if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            window.location.replace('https:' + window.location.href.slice(5));
        }

        // ── Rate-limit helpers ────────────────────────────────────────────────────
        function getRateLimitState() {
            try {
                const raw = sessionStorage.getItem(RATE_LIMIT_KEY);
                if (!raw) return { count: 0, firstAttemptAt: null };
                return JSON.parse(raw);
            } catch (_) {
                return { count: 0, firstAttemptAt: null };
            }
        }

        function recordLoginAttempt() {
            const state = getRateLimitState();
            const now = Date.now();
            if (!state.firstAttemptAt || now - state.firstAttemptAt > RATE_LIMIT_WINDOW_MS) {
                // Reset window
                sessionStorage.setItem(RATE_LIMIT_KEY, JSON.stringify({ count: 1, firstAttemptAt: now }));
                return { blocked: false };
            }
            state.count += 1;
            sessionStorage.setItem(RATE_LIMIT_KEY, JSON.stringify(state));
            if (state.count > RATE_LIMIT_MAX_ATTEMPTS) {
                return { blocked: true, remainingMs: RATE_LIMIT_WINDOW_MS - (now - state.firstAttemptAt) };
            }
            return { blocked: false };
        }

        function isRateLimited() {
            const state = getRateLimitState();
            if (!state.firstAttemptAt) return false;
            const now = Date.now();
            if (now - state.firstAttemptAt > RATE_LIMIT_WINDOW_MS) {
                sessionStorage.removeItem(RATE_LIMIT_KEY);
                return false;
            }
            return state.count >= RATE_LIMIT_MAX_ATTEMPTS;
        }

        // ── UI helpers ───────────────────────────────────────────────────────────
        function showAdminMessage(message, type) {
            const el = document.getElementById('adminLoginMessage');
            if (!el) return;
            el.innerHTML = message;
            el.className = 'admin-auth-message ' + type;
        }

        function clearAdminMessage() {
            const el = document.getElementById('adminLoginMessage');
            if (!el) return;
            el.innerHTML = '';
            el.className = 'admin-auth-message';
        }

        // ── Admin login handler ──────────────────────────────────────────────────
        async function handleAdminLogin(event) {
            event.preventDefault();
            clearAdminMessage();

            // Check rate limit before attempting login
            if (isRateLimited()) {
                showAdminMessage(
                    '<i class="fas fa-ban"></i> Too many failed sign-in attempts. Please wait 15 minutes and try again.',
                    'error'
                );
                return;
            }

            if (!isSupabaseConfigured()) {
                showAdminMessage('Authentication service is unavailable. Please try again later.', 'error');
                return;
            }

            const email    = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const btn      = document.getElementById('adminLoginBtn');
            const origText = btn.innerHTML;

            btn.innerHTML = '<span class="loading-spinner" aria-hidden="true"></span> Signing in...';
            btn.disabled  = true;

            try {
                // 1. Authenticate with Supabase
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;

                const user = data.user;

                // 2. Verify admin role via is_admin() RPC (RBAC)
                const { data: adminData, error: adminError } = await supabaseClient
                    .rpc('is_admin');

                if (adminError || adminData !== true) {
                    // Not an admin – sign them out immediately
                    await supabaseClient.auth.signOut();
                    const result = recordLoginAttempt();
                    let msg = '<i class="fas fa-lock"></i> Access denied. You do not have admin privileges.';
                    if (result.blocked) {
                        msg += ' Too many attempts — access is temporarily locked.';
                    }
                    showAdminMessage(msg, 'error');
                    btn.innerHTML = origText;
                    btn.disabled  = false;
                    return;
                }

                // Successful admin login – clear any rate-limit state
                sessionStorage.removeItem(RATE_LIMIT_KEY);

                showAdminMessage('<i class="fas fa-check-circle"></i> Sign-in successful! Redirecting to dashboard&hellip;', 'success');
                setTimeout(() => { window.location.href = '/admin.html'; }, REDIRECT_DELAY_MS);

            } catch (err) {
                const result = recordLoginAttempt();
                let msg = (err && err.message) ? err.message : 'Sign-in failed. Please check your credentials.';
                // Avoid leaking internal Supabase error details
                if (msg.toLowerCase().includes('invalid login') || msg.toLowerCase().includes('invalid credentials')) {
                    msg = 'Invalid email or password.';
                }
                if (result.blocked) {
                    msg += ' Too many failed attempts — access is temporarily locked for 15 minutes.';
                }
                showAdminMessage('<i class="fas fa-exclamation-circle"></i> ' + msg, 'error');
                btn.innerHTML = origText;
                btn.disabled  = false;
            }
        }

        // ── On page load: redirect if already an authenticated admin ─────────────
        document.addEventListener('DOMContentLoaded', async function () {
            const wrapper = document.getElementById('adminAuthWrapper');

            if (!isSupabaseConfigured()) {
                if (wrapper) wrapper.classList.add('auth-ready');
                return;
            }

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session && session.user) {
                    const { data: adminData } = await supabaseClient
                        .rpc('is_admin');
                    if (adminData === true) {
                        // Already authenticated admin – go straight to dashboard
                        window.location.replace('/admin.html');
                        return;
                    }
                }
            } catch (_) {
                // Ignore – just show the form
            }

            if (wrapper) wrapper.classList.add('auth-ready');
        });
    </script>
</body>
</html>
